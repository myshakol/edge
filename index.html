<!DOCTYPE html>
<html lang="ru" data-env="web">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EDGE - Эротические фанты и покер на костях</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<script src="app.js"></script>
<body>
    <!-- HOME PAGE -->
    <div id="home-page" class="home-page">
        <header>
            <div class="header-left">
                <h1>EDGE</h1>
                <p>эротические фанты и покер на костях</p>
            </div>
                <div class="header-controls">
                <div class="theme-toggle" onclick="toggleTheme()" title="Переключить тему"></div>
                <div class="lang-selector" onclick="alert('EN version coming soon')">ru|eng</div>
            </div>

        </header>

        <div class="container">
            <button class="btn btn-play" onclick="goToGame()">ИГРАТЬ</button>

            <button class="collapsible" onclick="toggleCollapsible(this)">КОЛОДЫ</button>
            <div class="collapsible-content">
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="main-deck" checked onchange="updateDeckSelection()">
                        <label for="main-deck">Основная колода</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="photo-deck" checked onchange="updateDeckSelection()">
                        <label for="photo-deck">Фото-видео съемка 🎁</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="extra-deck" onchange="updateDeckSelection()">
                        <label for="extra-deck">Экстра колода Ж<span class="info-icon" onclick="alert('Доп. информация')">❓</span></label>
                    </div>
                </div>
            </div>

            <div class="radio-group">
                <div class="radio-item">
                    <input type="radio" id="mode-just" name="mode" value="just" checked onchange="onModeChange()">
                    <label for="mode-just">просто фанты</label>
                </div>
                <div class="radio-item">
                    <input type="radio" id="mode-poker" name="mode" value="poker" onchange="onModeChange()">
                    <label for="mode-poker">покер на костях</label>
                </div>
            </div>

            <div class="footer-links">
                <a href="#" onclick="alert('Краткий гайд')">Краткий гайд</a>
                <a href="#" onclick="alert('Подробные правила')">Подробные правила</a>
                <a href="#" onclick="alert('Соцсети и другие проекты')">Соцсети и другие проекты</a>
            </div>
        </div>
    </div>

    <!-- GAME PAGE -->
    <div id="game-page" class="game-wrapper">
        <div class="game-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="game-header-left">EDGE</div>
                <div class="theme-toggle" onclick="toggleTheme()" title="Переключить тему"></div>
            </div>
            <div class="game-header-buttons">
                <button class="game-header-btn" onclick="goHome()">⌂</button>
                <button class="game-header-btn" onclick="resetGameConfirm()">⟲</button>
            </div>
        </div>

        <div class="card-container">
            <div class="card">
                <div class="card-header">
                    <div>
                        <span id="card-color" class="card-color color-green">зеленая</span>
                        <span id="card-type" style="font-size: 10px; color: var(--text-muted);">основная</span>
                    </div>
                    <div style="font-size: 10px; color: var(--text-muted); text-align: right;">
                        <span id="card-id">--</span>
                    </div>
                </div>

                <div class="card-text" id="card-text">
                    Нажми кнопку "карта М" или "карта Ж" чтобы вытянуть задание
                </div>

                <div id="card-meta" class="card-meta" style="display: none;">
                </div>

                <div class="timer-container">
                    <div class="timer" id="timer" onclick="startTimer()">00:00</div>
                </div>
            </div>
        </div>
        <div class="game-footer">        
            <div class="card-buttons">
                <button class="card-btn" id="btn-male" onclick="drawCard('male')">карта М</button>
                <button class="card-btn" id="btn-female" onclick="drawCard('female')">карта Ж</button>
                <button class="card-btn" id="btn-extra" onclick="drawCard('extra')" style="display: none;">карта Ж ○</button>
            </div>

            <div class="control-buttons">
                <button class="level-up-btn" onclick="levelUpConfirm()">уровень +</button>
                <button class="palette-btn" onclick="toggleColorSelector()">⊕</button>
            </div>
        </div>

        <div class="color-selector-container" id="color-selector">
            <button class="color-btn" onclick="setLevel('green')" data-level="green" style="color: #7d8f6f; border-color: #7d8f6f;">G</button>
            <button class="color-btn" onclick="setLevel('yellow')" data-level="yellow" style="color: #c9a05d; border-color: #c9a05d;">Y</button>
            <button class="color-btn" onclick="setLevel('red')" data-level="red" style="color: #b84a50; border-color: #b84a50;">R</button>
            <button class="color-btn" onclick="setLevel('burgundy')" data-level="burgundy" style="color: #8b4a6d; border-color: #8b4a6d;">B</button>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-text">Вы уверены?</h2>
            <div class="modal-buttons">
                <button onclick="closeModal()">Отмена</button>
                <button onclick="confirmGoHome()">ОК</button>
            </div>
        </div>
    </div>

</body>
</html>
