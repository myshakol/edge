<!DOCTYPE html>
<html lang="ru" data-env="web">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EDGE - Эротические фанты и покер на костях</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        :root {
            --bg: #ffffff;
            --text: #000000;
            --text-muted: #666666;
            --border: #000000;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover-bg: #000000;
            --btn-hover-text: #ffffff;
            --card-bg: #ffffff;
            --collapsible-content-bg: #f9f9f9;
            --collapsible-hover-bg: #f5f5f5;
            --timer-border: #dddddd;
            --meta-border: #cccccc;
            --modal-overlay: rgba(0,0,0,0.5);
        }

        [data-theme="dark"] {
            --bg: #1a1a1a;
            --text: #e0e0e0;
            --text-muted: #999999;
            --border: #e0e0e0;
            --btn-bg: #1a1a1a;
            --btn-text: #e0e0e0;
            --btn-hover-bg: #e0e0e0;
            --btn-hover-text: #1a1a1a;
            --card-bg: #242424;
            --collapsible-content-bg: #2a2a2a;
            --collapsible-hover-bg: #333333;
            --timer-border: #555555;
            --meta-border: #555555;
            --modal-overlay: rgba(0,0,0,0.7);
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
        }

        :root {
            --app-top-inset: 0px;
            --app-bottom-inset: 0px;
            --app-fullscreen-offset-top: 0px;
        }

        .home-page,
        .game-wrapper {
            padding-top: calc(var(--app-top-inset) + var(--app-fullscreen-offset-top));
            padding-bottom: var(--app-bottom-inset);
        }


        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }


        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 30px 40px;
            border-bottom: 2px solid var(--border);
        }

        .header-left h1 {
            font-size: 48px;
            font-weight: 600;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .header-left p {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .lang-selector {
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            border-bottom: 1px solid var(--text);
            padding-bottom: 2px;
        }

        /* MAIN CONTENT */
        .container {
            max-width: 600px;
            margin: 60px auto 0 auto;
            padding: 0 40px;
        }

        /* BUTTONS */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 20px 0;
            border: 2px solid var(--border);
            background-color: var(--btn-bg);
            color: var(--btn-text);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }

        .btn-play {
            font-size: 20px;
            padding: 20px;
            margin: 40px 0;
        }

        /* COLLAPSIBLE */
        .collapsible {
            width: 100%;
            padding: 12px;
            margin: 30px 0 0 0;    
            border: 2px solid var(--border);
            background-color: var(--btn-bg);
            color: var(--btn-text);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }


        .collapsible:hover {
            background-color: var(--collapsible-hover-bg);
        }

        .collapsible.active {
            background-color: var(--btn-hover-bg);;
            color: var(--btn-hover-text);
        }

        .collapsible-content {
            display: none;
            padding: 20px;
            margin: 0 0 30px 0;  
            border: 2px solid var(--border);
            border-top: none;
            background-color: var(--collapsible-content-bg);
        }

        .collapsible-content.active {
            display: block;
        }


        /* CHECKBOXES */
        .checkbox-group {
            margin: 0;
        }

        .checkbox-item:first-child {
            margin-top: 0;
        }

        .checkbox-item:last-child {
            margin-bottom: 0;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin: 12px 0;
            font-size: 14px;
        }

        .checkbox-item input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--text);
        }

        .checkbox-item label {
            cursor: pointer;
            flex: 1;
        }

        .info-icon {
            cursor: help;
            margin-left: 8px;
            font-weight: 600;
        }

        /* RADIO BUTTONS */
        .radio-group {
            display: flex;
            gap: 30px;
            margin: 30px 0;
            justify-content: center;
        }

        .radio-item {
            display: flex;
            align-items: center;
            font-size: 14px;
        }

        .radio-item input[type="radio"] {
            margin-right: 8px;
            cursor: pointer;
            accent-color: var(--text);
        }

        .radio-item label {
            cursor: pointer;
        }

        /* FOOTER LINKS */
        .footer-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 80px;
            padding-bottom: 60px;
            gap: 20px;
        }

        .footer-links a {
            font-size: 13px;
            color: var(--text);
            text-decoration: none;
            border-bottom: 1px solid var(--text);
            padding-bottom: 3px;
            transition: all 0.2s;
        }

        .footer-links a:hover {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }

        /* GAME PAGE STYLES */


        .game-wrapper {
            display: none;
            flex-direction: column;
            height: 100dvh;
            padding: 20px;
            padding-top: calc(20px + var(--app-top-inset) + var(--app-fullscreen-offset-top));
            padding-bottom: calc(20px + var(--app-bottom-inset));
            overflow: hidden;
        }


        .game-wrapper.active {
            display: flex;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 10px 0;
            border-bottom: 2px solid var(--border);
        }

        .game-header-left {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .game-header-buttons {
            display: flex;
            gap: 8px;
        }

        .game-header-btn {
            width: 40px;
            height: 40px;
            border: 2px solid var(--border);
            background-color: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .game-header-btn:hover {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }

        .card-container {
            flex: 1;
            display: flex;
            justify-content: center;  /* центрируем по горизонтали */
            align-items: stretch;     /* карта тянется по высоте */
            margin: 0;
            padding: 0;
            min-height: 0;
            overflow: hidden;
        }

        .card {
            width: 100%;
            max-width: 600px;
            border: 3px solid var(--border);
            padding: 20px;
            background-color: var(--card-bg);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 0;
            overflow-y: auto;
        }



        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            gap: 10px;
        }

        .card-header > div:first-child {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-color {
            font-weight: 600;
            font-size: 13px;
        }

        .card-text {
            font-size: 16px;
            line-height: 1.6;
            margin: 30px 0;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin: 20px 0;
            padding: 10px;
            border: 1px dashed var(--meta-border);
            text-align: left;
        }


        .card-meta span {
            display: flex;
            align-items: center;
            margin: 4px 0;
        }

        .card-meta svg {
            flex-shrink: 0;
            margin-right: 6px;
        }

        .timer-container {
            text-align: center;
            margin-top: auto;
        }

        .timer {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 6px 10px;
            border: 1px solid var(--timer-border);
            display: inline-block;
            transition: all 0.2s;
        }

        .timer:hover {
            border-color: var(--border);
        }

        .timer.running {
            color: #d32f2f;
        }

        .color-selector-container {
            display: none;
            position: fixed;
            bottom: 180px;
            right: 30px;
            background-color: var(--bg);
            border: 2px solid var(--border);
            padding: 12px;
            gap: 8px;
            z-index: 500;
            flex-direction: column;
        }

        .color-selector-container.active {
            display: flex;
        }

        .color-btn {
            width: 45px;
            height: 45px;
            border: 2px solid var(--border);
            background-color: var(--btn-bg);
            color: var(--btn-text);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .color-btn:hover {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }

        .color-btn.active {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }

        .control-buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            justify-content: center;
            align-items: center;
        }

        .level-up-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid var(--border);
            background-color: var(--btn-bg);
            color: var(--btn-text);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .level-up-btn:hover {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }

        .palette-btn {
            width: 50px;
            height: 50px;
            border: 2px solid var(--border);
            background-color: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 20px;
        }

        .palette-btn:hover {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }

        /* Низ экрана: общий блок для всех кнопок, прижат к safe area */
        .game-footer {
            margin-top: auto;
            padding-top: 16px;
        }


        .card-buttons {
            display: flex;
            gap: 12px;
            margin-top: 0;
            justify-content: center;
        }

        .control-buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: center;
            align-items: center;
        }        

        .card-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid var(--border);
            background-color: var(--btn-bg);
            color: var(--btn-text);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .card-btn:hover {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }

        .card-btn.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* COLOR PALETTE */
        .color-green { color: #7d8f6f; }
        .color-yellow { color: #c9a05d; }
        .color-red { color: #b84a50; }
        .color-burgundy { color: #8b4a6d; }

        /* THEME TOGGLE */
        .theme-toggle {
            width: 44px;
            height: 24px;
            border-radius: 999px;
            background-color: var(--btn-bg);
            border: 2px solid var(--border);
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: background-color 0.25s, border-color 0.25s;
            box-sizing: border-box;
        }

        /* Круг рисуем как внутренний элемент без всяких overflow/масок */
        .theme-toggle {
            width: 44px;
            height: 24px;
            border-radius: 999px;
            background-color: var(--btn-bg);
            border: 2px solid var(--border);
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            box-sizing: border-box;
            transition: background-color 0.25s, border-color 0.25s;
        }

        /* Круг — чуть больше и поднимаем его на 1px */
        .theme-toggle::before {
            content: '';
            position: absolute;
            top: 1px;      /* было 2px */
            left: 2px;
            width: 18px;   /* было 16px */
            height: 18px;  /* было 16px */
            border-radius: 50%;
            background-color: var(--text);
            transition: transform 0.25s, background-color 0.25s;
            pointer-events: none;
        }

        /* Сдвиг вправо под новый размер круга */
        .theme-toggle.theme-toggle-on::before {
            transform: translateX(18px); /* можно оставить 20, визуально ровно */
        }



        /* RESPONSIVE */
        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }

            .card-text {
                font-size: 14px;
            }

            .timer {
                font-size: 18px;
                padding: 4px 8px;
            }

            .game-wrapper {
                padding-left: 10px;
                padding-right: 10px;
            }

            .control-buttons {
                margin-top: 12px;
            }

            .card-buttons {
                margin-top: 12px;
            }
        }


        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-overlay);
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 3px solid var(--border);
            padding: 40px;
            max-width: 400px;
            text-align: center;
        }

        .modal-content h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border);
            background-color: var(--btn-bg);
            color: var(--btn-text);
            cursor: pointer;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            font-weight: 600;
        }

        .modal-buttons button:hover {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
        }


        .empty-deck-message {
            text-align: center;
            font-size: 14px;
            color: #b84a50;
            padding: 20px;
        }

        /* Active tap feedback — MUST come AFTER :hover to override it */
        .btn:active,
        .card-btn:active,
        .game-header-btn:active,
        .level-up-btn:active,
        .palette-btn:active,
        .color-btn:active,
        .collapsible:active,
        .modal-buttons button:active {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
            transform: scale(0.97); /* чуть мягче, чтобы на десктопе не казались огромными */
            transition: transform 0.05s, background-color 0.05s, color 0.05s;
        }

        /* Fix sticky hover on iOS — active state for tap feedback */
        @media (hover: none) {
            /* На тач-устройствах hover не нужен вообще */
            .btn:hover,
            .card-btn:hover,
            .game-header-btn:hover,
            .level-up-btn:hover,
            .palette-btn:hover,
            .color-btn:hover,
            .collapsible:hover,
            .modal-buttons button:hover,
            .footer-links a:hover {
                background-color: var(--btn-bg);
                color: var(--btn-text);
            }

            .collapsible.active:hover {
                background-color: var(--btn-hover-bg);
                color: var(--btn-hover-text);
            }
        }




    </style>
</head>
<body>
    <!-- HOME PAGE -->
    <div id="home-page" class="home-page">
        <header>
            <div class="header-left">
                <h1>EDGE</h1>
                <p>эротические фанты и покер на костях</p>
            </div>
            <div style="display: flex; align-items: center; gap: 16px;">
            <div class="theme-toggle" onclick="toggleTheme()" title="Переключить тему"></div>
            <div class="lang-selector" onclick="alert('EN version coming soon')">ru|eng</div>
        </div>
        </header>

        <div class="container">
            <button class="btn btn-play" onclick="goToGame()">ИГРАТЬ</button>

            <button class="collapsible" onclick="toggleCollapsible(this)">КОЛОДЫ</button>
            <div class="collapsible-content">
                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" id="main-deck" checked onchange="updateDeckSelection()">
                        <label for="main-deck">Основная колода</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="photo-deck" checked onchange="updateDeckSelection()">
                        <label for="photo-deck">Фото-видео съемка 🎁</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="extra-deck" onchange="updateDeckSelection()">
                        <label for="extra-deck">Экстра колода Ж<span class="info-icon" onclick="alert('Доп. информация')">❓</span></label>
                    </div>
                </div>
            </div>

            <div class="radio-group">
                <div class="radio-item">
                    <input type="radio" id="mode-just" name="mode" value="just" checked onchange="onModeChange()">
                    <label for="mode-just">просто фанты</label>
                </div>
                <div class="radio-item">
                    <input type="radio" id="mode-poker" name="mode" value="poker" onchange="onModeChange()">
                    <label for="mode-poker">покер на костях</label>
                </div>
            </div>

            <div class="footer-links">
                <a href="#" onclick="alert('Краткий гайд')">Краткий гайд</a>
                <a href="#" onclick="alert('Подробные правила')">Подробные правила</a>
                <a href="#" onclick="alert('Соцсети и другие проекты')">Соцсети и другие проекты</a>
            </div>
        </div>
    </div>

    <!-- GAME PAGE -->
    <div id="game-page" class="game-wrapper">
        <div class="game-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="game-header-left">EDGE</div>
                <div class="theme-toggle" onclick="toggleTheme()" title="Переключить тему"></div>
            </div>
            <div class="game-header-buttons">
                <button class="game-header-btn" onclick="goHome()">⌂</button>
                <button class="game-header-btn" onclick="resetGameConfirm()">⟲</button>
            </div>
        </div>

        <div class="card-container">
            <div class="card">
                <div class="card-header">
                    <div>
                        <span id="card-color" class="card-color color-green">зеленая</span>
                        <span id="card-type" style="font-size: 10px; color: var(--text-muted);">основная</span>
                    </div>
                    <div style="font-size: 10px; color: var(--text-muted); text-align: right;">
                        <span id="card-id">--</span>
                    </div>
                </div>

                <div class="card-text" id="card-text">
                    Нажми кнопку "карта М" или "карта Ж" чтобы вытянуть задание
                </div>

                <div id="card-meta" class="card-meta" style="display: none;">
                </div>

                <div class="timer-container">
                    <div class="timer" id="timer" onclick="startTimer()">00:00</div>
                </div>
            </div>
        </div>
        <div class="game-footer">        
            <div class="card-buttons">
                <button class="card-btn" id="btn-male" onclick="drawCard('male')">карта М</button>
                <button class="card-btn" id="btn-female" onclick="drawCard('female')">карта Ж</button>
                <button class="card-btn" id="btn-extra" onclick="drawCard('extra')" style="display: none;">карта Ж ○</button>
            </div>

            <div class="control-buttons">
                <button class="level-up-btn" onclick="levelUpConfirm()">уровень +</button>
                <button class="palette-btn" onclick="toggleColorSelector()">⊕</button>
            </div>
        </div>

        <div class="color-selector-container" id="color-selector">
            <button class="color-btn" onclick="setLevel('green')" data-level="green" style="color: #7d8f6f; border-color: #7d8f6f;">G</button>
            <button class="color-btn" onclick="setLevel('yellow')" data-level="yellow" style="color: #c9a05d; border-color: #c9a05d;">Y</button>
            <button class="color-btn" onclick="setLevel('red')" data-level="red" style="color: #b84a50; border-color: #b84a50;">R</button>
            <button class="color-btn" onclick="setLevel('burgundy')" data-level="burgundy" style="color: #8b4a6d; border-color: #8b4a6d;">B</button>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-text">Вы уверены?</h2>
            <div class="modal-buttons">
                <button onclick="closeModal()">Отмена</button>
                <button onclick="confirmGoHome()">ОК</button>
            </div>
        </div>
    </div>

    <script>
        
        document.addEventListener('touchstart', function () {}, { passive: true });

        // Данные игры
        let gameState = {
            decks: {
                GM: null, GF: null, YM: null, YF: null, RM: null, RF: null, BM: null, BF: null, EXL1: null, EXL2: null
            },
            active_decks: ['GM', 'GF', 'YM', 'YF', 'RM', 'RF', 'BM', 'BF'],
            current_color: 'green',
            played_cards: [],
            timer_interval: null,
            timer_duration: 0,
            game_mode: 'just'
        };

        const colorMap = {
            'green': { name: 'зеленая', hex: '#7d8f6f', code: 'G', type: 'основная' },
            'yellow': { name: 'желтая', hex: '#c9a05d', code: 'Y', type: 'фото/видео' },
            'red': { name: 'красная', hex: '#b84a50', code: 'R', type: 'основная' },
            'burgundy': { name: 'бордовая', hex: '#8b4a6d', code: 'B', type: 'основная' }
        };

        function setCssVar(name, value) {
            document.documentElement.style.setProperty(name, value);
        }

        function setAppInsets(top = 0, bottom = 0) {
            setCssVar('--app-top-inset', `${Math.max(0, Number(top) || 0)}px`);
            setCssVar('--app-bottom-inset', `${Math.max(0, Number(bottom) || 0)}px`);
        }

        function setFullscreenExtraOffset(enabled) {
            setCssVar('--app-fullscreen-offset-top', enabled ? '36px' : '0px');
        }

        function resetAppInsets() {
            setAppInsets(0, 0);
            setFullscreenExtraOffset(false);
        }

        function isTelegramMobilePlatform() {
            if (!tg) return false;

            const platform = String(tg.platform || '').toLowerCase();

            return [
                'ios',
                'android',
                'android_x',
                'weba',
                'webk'
            ].includes(platform);
        }

        function getTelegramExpandedState() {
            if (!tg) return false;

            if (typeof tg.isExpanded === 'boolean') {
                return tg.isExpanded;
            }

            if (tg.viewport && typeof tg.viewport.isExpanded === 'boolean') {
                return tg.viewport.isExpanded;
            }

            if (tg.viewport && typeof tg.viewport.expansion === 'boolean') {
                return tg.viewport.expansion;
            }

            return false;
        }

        function getTelegramFullscreenState() {
            if (!tg) return false;

            if (typeof tg.isFullscreen === 'boolean') {
                return tg.isFullscreen;
            }

            if (tg.viewport && typeof tg.viewport.isFullscreen === 'boolean') {
                return tg.viewport.isFullscreen;
            }

            if (tg.viewport && typeof tg.viewport.fullscreen === 'boolean') {
                return tg.viewport.fullscreen;
            }

            return false;
        }

        function shouldApplyTopExtraOffset() {
            if (!tg) return false;

            const isMobile = isTelegramMobilePlatform();
            const isExpanded = getTelegramExpandedState();
            const isFullscreen = getTelegramFullscreenState();

            return isMobile && isExpanded && !isFullscreen;
        }



        function applyTelegramInsets() {
            if (!tg) {
                resetAppInsets();
                return;
            }

            const contentInsets =
                tg.contentSafeAreaInset ||
                tg.contentSafeArea ||
                {};

            const safeInsets =
                tg.safeAreaInset ||
                tg.safeArea ||
                {};

            const top = Number(contentInsets.top ?? safeInsets.top ?? 0);
            const bottom = Number(contentInsets.bottom ?? safeInsets.bottom ?? 0);

            setAppInsets(top, bottom);
            setFullscreenExtraOffset(shouldApplyTopExtraOffset());

            console.log('TG STATE', {
                platform: tg?.platform,
                isExpanded: tg?.isExpanded,
                isFullscreen: tg?.isFullscreen,
                viewport: tg?.viewport,
                safeAreaInset: tg?.safeAreaInset,
                contentSafeAreaInset: tg?.contentSafeAreaInset
            });

        }




        // Telegram WebApp (может быть null в обычном браузере)

        let tg = null;

        (function initTelegram() {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                document.documentElement.setAttribute('data-env', 'telegram');

                try {
                    tg.ready();
                } catch (e) {}

                try {
                    tg.expand();
                } catch (e) {}

                applyTelegramInsets();

                try {
                    if (tg.requestContentSafeArea) tg.requestContentSafeArea();
                } catch (e) {}

                try {
                    if (tg.requestSafeArea) tg.requestSafeArea();
                } catch (e) {}

                try {
                    if (tg.requestViewport) tg.requestViewport();
                } catch (e) {}

                if (tg.onEvent) {
                    tg.onEvent('content_safe_area_changed', (event) => {
                        const insets = event?.insets || event || {};
                        const top = Number(insets.top || 0);
                        const bottom = Number(insets.bottom || 0);

                        setAppInsets(top, bottom);
                        setFullscreenExtraOffset(shouldApplyTopExtraOffset());
                    });

                    tg.onEvent('safe_area_changed', (event) => {
                        const insets = event?.insets || event || {};
                        const top = Number(insets.top || 0);
                        const bottom = Number(insets.bottom || 0);

                        setAppInsets(top, bottom);
                        setFullscreenExtraOffset(shouldApplyTopExtraOffset());
                    });

                    tg.onEvent('viewport_changed', () => {
                        applyTelegramInsets();
                    });

                    tg.onEvent('fullscreen_changed', () => {
                        applyTelegramInsets();
                    });
                }


                console.log('Running inside Telegram');
            } else {
                document.documentElement.setAttribute('data-env', 'web');
                resetAppInsets();
                console.log('Running in normal browser');
            }
        })();



        // ─── Theme toggle ───
        function getPreferredTheme() {
            if (tg && tg.colorScheme) return tg.colorScheme;
            const saved = localStorage.getItem('edge-theme');
            if (saved) return saved;
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                return 'dark';
            }
            return 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            localStorage.setItem('edge-theme', next);
            triggerHaptic('light');

            document.querySelectorAll('.theme-toggle').forEach(el => {
                if (next === 'dark') {
                    el.classList.add('theme-toggle-on');
                } else {
                    el.classList.remove('theme-toggle-on');
                }
            });
        }

        applyTheme(getPreferredTheme());
        document.addEventListener('DOMContentLoaded', () => {
            const current = document.documentElement.getAttribute('data-theme');
            document.querySelectorAll('.theme-toggle').forEach(el => {
                if (current === 'dark') el.classList.add('theme-toggle-on');
            });
            console.log('🎮 EDGE Game loaded');
            
            // Предзагрузка колод в фоне
            setTimeout(() => { loadDecks(); }, 500);            
        });


        // ─── Haptic Feedback ───
        function triggerHaptic(style) {
            if (tg && tg.HapticFeedback) {
                try { tg.HapticFeedback.impactOccurred(style || 'light'); } catch(e) {}
            }
        }

        function triggerHapticNotification(type) {
            if (tg && tg.HapticFeedback) {
                try { tg.HapticFeedback.notificationOccurred(type || 'success'); } catch(e) {}
            }
        }


        async function loadDecks() {
            const deckCodes = ['GM', 'GF', 'YM', 'YF', 'RM', 'RF', 'BM', 'BF', 'EXL1', 'EXL2'];
            for (let code of deckCodes) {
                try {
                    const response = await fetch(`data/${code.toLowerCase()}.json`);
                    if (!response.ok) throw new Error(`Failed to load ${code}.json`);
                    const data = await response.json();
                    gameState.decks[code] = JSON.parse(JSON.stringify(data.cards)); // Deep copy
                    console.log(`✓ Loaded ${code}: ${gameState.decks[code].length} cards`);
                } catch (e) {
                    console.warn(`Could not load ${code}.json:`, e);
                    gameState.decks[code] = [];
                }
            }
        }

        function toggleCollapsible(btn) {
            btn.classList.toggle('active');
            btn.nextElementSibling.classList.toggle('active');
        }

        function updateDeckSelection() {
            const mainDeck = document.getElementById('main-deck').checked;
            const photoDeck = document.getElementById('photo-deck').checked;
            const extraDeck = document.getElementById('extra-deck').checked;
            
            gameState.active_decks = [];
            if (mainDeck) gameState.active_decks.push('GM', 'GF');
            if (photoDeck) gameState.active_decks.push('YM', 'YF');
            if (extraDeck) gameState.active_decks.push('RM', 'RF', 'BM', 'BF', 'EXL1', 'EXL2');
        }

        function onModeChange() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const extraDeckCheckbox = document.getElementById('extra-deck');
            
            if (mode === 'poker') {
                extraDeckCheckbox.checked = true;
                extraDeckCheckbox.disabled = true;
                updateDeckSelection();
            } else {
                extraDeckCheckbox.disabled = false;
            }
        }

        function goToGame() {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('game-page').classList.add('active');
            
            gameState.game_mode = document.querySelector('input[name="mode"]:checked').value;
            const extraDeck = document.getElementById('extra-deck').checked;
            const btnExtra = document.getElementById('btn-extra');
            
            // Кнопка появляется, если экстра-колода выбрана (независимо от режима)
            if (extraDeck) {
                btnExtra.style.display = 'flex';
            } else {
                btnExtra.style.display = 'none';
            }
            
            updateDeckSelection();
            loadDecks();

            // ✅ Telegram MainButton (только если реально внутри Telegram)
            /*if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tg.MainButton.setText('Поделиться EDGE');
                tg.MainButton.show();
                tg.MainButton.onClick(() => {
                    const shareText = `Я играю в EDGE!\nТекущий уровень: ${gameState.current_color}`;
                    tg.openTelegramLink(
                        `https://t.me/share/url?url=${encodeURIComponent('https://t.me/your_bot_name')}&text=${encodeURIComponent(shareText)}`
                    );
                });
            }*/


        }

        function goHome() {
            document.getElementById('modal').classList.add('active');
            document.getElementById('modal-text').textContent = 'Вы уверены?';
            const confirmBtn = document.querySelector('.modal-buttons button:nth-child(2)');
            confirmBtn.onclick = confirmGoHome;
        }

        function closeModal() {
            triggerHaptic('light');
            document.getElementById('modal').classList.remove('active');
        }

        function confirmGoHome() {
            triggerHaptic('medium');
            // Полностью сбрасываем игру в нулевое состояние
            resetGame();

            document.getElementById('game-page').classList.remove('active');
            document.getElementById('home-page').style.display = 'block';
            closeModal();
        }

        function resetGameConfirm() {
            triggerHaptic('light');
            document.getElementById('modal').classList.add('active');
            document.getElementById('modal-text').textContent = 'Вы уверены, что хотите перезапустить игру?';
            
            const confirmBtn = document.querySelector('.modal-buttons button:nth-child(2)');
            confirmBtn.onclick = function() {
                resetGame();
                closeModal();
            };
        }

        function resetGame() {
            // Останавливаем и сбрасываем таймер
            if (gameState.timer_interval) {
                clearInterval(gameState.timer_interval);
                gameState.timer_interval = null;
            }
            gameState.timer_duration = 0;
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('timer').classList.remove('running');

            gameState.played_cards = [];
            document.getElementById('card-text').textContent = 'Нажми кнопку "карта М" или "карта Ж" чтобы вытянуть задание';
            document.getElementById('card-meta').style.display = 'none';
            gameState.current_color = 'green';
            setLevel('green');

            loadDecks();
        }

        function levelUpConfirm() {
            triggerHaptic('light');
            document.getElementById('modal').classList.add('active');
            document.getElementById('modal-text').textContent = 'Перейти на следующий уровень?';
            
            const confirmBtn = document.querySelector('.modal-buttons button:nth-child(2)');
            confirmBtn.onclick = function() {
                levelUp();
                closeModal();
            };
        }

        function levelUp() {
            const levels = ['green', 'yellow', 'red', 'burgundy'];
            const currentIndex = levels.indexOf(gameState.current_color);
            
            if (currentIndex < levels.length - 1) {
                setLevel(levels[currentIndex + 1]);
            } else {
                alert('Вы достигли максимального уровня!');
            }
        }

        function setLevel(level) {
            triggerHapticNotification('success');
            gameState.current_color = level;

            // Скрыть палитру после выбора
            document.getElementById('color-selector').classList.remove('active');

            // Сбросить карту на начальный текст
            document.getElementById('card-text').textContent = 'Нажми кнопку "карта М" или "карта Ж" чтобы вытянуть задание';
            document.getElementById('card-id').textContent = '--';
            document.getElementById('card-meta').style.display = 'none';
            document.getElementById('timer').textContent = '00:00';
            document.getElementById('timer').classList.remove('running');
            if (gameState.timer_interval) {
                clearInterval(gameState.timer_interval);
                gameState.timer_interval = null;
            }
            gameState.timer_duration = 0;            
            
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-level="${level}"]`)?.classList.add('active');
            
            const cardColor = document.getElementById('card-color');
            cardColor.textContent = colorMap[level].name;
            cardColor.className = `card-color color-${level}`;
            
            const cardType = document.getElementById('card-type');
            cardType.textContent = colorMap[level].type;
            
            // Скрываем/показываем кнопку "карта Ж ○" в зависимости от уровня
            const btnExtra = document.getElementById('btn-extra');
            if (level === 'burgundy') {
                // На бордовом уровне кнопка скрывается
                btnExtra.style.display = 'none';
            } else {
                // На других уровнях - всегда видна, если выбрана экстра-колода
                const extraDeck = document.getElementById('extra-deck').checked;
                btnExtra.style.display = extraDeck ? 'flex' : 'none';
            }
        }

        function toggleColorSelector() {
            const selector = document.getElementById('color-selector');
            selector.classList.toggle('active');
        }

        function drawCard(type) {
             triggerHaptic('light');
            // Останавливаем старый таймер полностью
            if (gameState.timer_interval) {
                clearInterval(gameState.timer_interval);
                gameState.timer_interval = null;
            }
            document.getElementById('timer').classList.remove('running');
            
            // Определяем, из какой колоды тянуть карту
            let deckCode;
            
            if (type === 'extra') {
                // Для экстра колоды: выбираем в зависимости от уровня
                // EXL1 для зеленого уровня, EXL2 для желтого и красного
                if (gameState.current_color === 'green') {
                    deckCode = 'EXL1';
                } else if (gameState.current_color === 'yellow' || gameState.current_color === 'red') {
                    deckCode = 'EXL2';
                } else {
                    // Для бордового уровня кнопка не должна быть видна
                    return;
                }
            } else {
                // Для обычных: color code + gender code
                const colorCode = colorMap[gameState.current_color].code;
                const genderCode = type === 'male' ? 'M' : 'F';
                deckCode = colorCode + genderCode;
            }

            // Проверяем, есть ли карты в этой колоде
            const deck = gameState.decks[deckCode];
            if (!deck || deck.length === 0) {
                showEmptyDeck(deckCode, type);
                return;
            }

            // ✅ ПРАВИЛЬНО: Считаем общее количество карт с учетом count
            const totalCards = deck.reduce((sum, card) => sum + card.count, 0);
            
            if (totalCards === 0) {
                showEmptyDeck(deckCode, type);
                return;
            }

            // Генерируем случайное число от 0 до totalCards - 1
            let randomPick = Math.floor(Math.random() * totalCards);
            
            // Находим карту, на которую попало случайное число
            let selectedCard = null;
            let selectedIndex = -1;
            
            for (let i = 0; i < deck.length; i++) {
                if (randomPick < deck[i].count) {
                    selectedCard = deck[i];
                    selectedIndex = i;
                    break;
                }
                randomPick -= deck[i].count;
            }

            // Отображаем карту
            displayCard(selectedCard, deckCode);

            // Уменьшаем count или удаляем карту
            selectedCard.count--;
            if (selectedCard.count <= 0) {
                deck.splice(selectedIndex, 1);
                console.log(`✗ Card ${selectedCard.id} removed from ${deckCode} (was last copy)`);
            } else {
                console.log(`✓ Card ${selectedCard.id} count reduced to ${selectedCard.count}`);
            }

            console.log(`${deckCode} remaining: ${deck.length} unique cards, ${totalCards - 1} total cards`);
        }


        function displayCard(card, deckCode) {
            // ID карты
            document.getElementById('card-id').textContent = card.id;

            // Текст карты
            document.getElementById('card-text').textContent = card.text;

            // Метаинформация
            const metaDiv = document.getElementById('card-meta');
            let metaHTML = '';


            const icons = {
                time: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
                location: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>',
                partial: '<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2 A10 10 0 0 1 12 22 Z" fill="currentColor"/></svg>',
                full: '<svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/></svg>',
                question: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 3-3 3"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>',
                photo: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>'
            };

            if (card.duration) {
                metaHTML += `<span>${icons.time} Время: ${card.duration} сек</span>`;
            }

            if (card.location) {
                metaHTML += `<span>${icons.location} Место: ${card.location}</span>`;
            }

            if (card.temporary_nudity) {
                metaHTML += `<span>${icons.partial} Частичное обнажение</span>`;
            }

            if (card.permanent_nudity) {
                metaHTML += `<span>${icons.full} Снять одежду</span>`;
            }

            if (card.question) {
                metaHTML += `<span>${icons.question} Вопрос</span>`;
            }

            if (card.photo) {
                metaHTML += `<span>${icons.photo} Фото/видео съёмка</span>`;
            }

            if (metaHTML) {
                metaDiv.innerHTML = metaHTML;
                metaDiv.style.display = 'block';
            } else {
                metaDiv.style.display = 'none';
            }

            // Устанавливаем дuration для таймера
            gameState.timer_duration = card.duration || 0;
             // Сбрасываем таймер на новое значение
            const minutes = Math.floor(gameState.timer_duration / 60);
            const seconds = gameState.timer_duration % 60;
            document.getElementById('timer').textContent = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById('timer').classList.remove('running');
            
        }

        function showEmptyDeck(deckCode, type) {
            // Определяем цвет и пол на основе кода колоды
            const colorCode = deckCode.charAt(0); // 'G', 'Y', 'R', 'B'
            const genderCode = deckCode.charAt(1); // 'M', 'F'
            
            // Получаем названия
            const colorName = Object.values(colorMap).find(c => c.code === colorCode)?.name || deckCode;
            const genderName = genderCode === 'M' ? 'М' : (genderCode === 'F' ? 'Ж' : '');
            
            document.getElementById('card-id').textContent = deckCode;
            document.getElementById('card-text').innerHTML = 
                `<div class="empty-deck-message">Карты в колоде <strong>${colorName}</strong> <strong>${genderName}</strong> закончились. Переходите на следующий уровень!</div>`;
            document.getElementById('card-meta').style.display = 'none';
            document.getElementById('timer').textContent = '00:00';
        }

        function startTimer() {
            triggerHaptic('soft');
            const timer = document.getElementById('timer');
            if (gameState.timer_duration <= 0) return;

            // Если таймер уже запущен — остановить и вернуть исходное значение, не запуская заново
            if (gameState.timer_interval) {
                clearInterval(gameState.timer_interval);
                gameState.timer_interval = null;
                timer.classList.remove('running');

                const minutes = Math.floor(gameState.timer_duration / 60);
                const seconds = gameState.timer_duration % 60;
                timer.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                return;
            }

            // Таймер остановлен — запускаем отсчет с исходного значения
            let remaining = gameState.timer_duration;
            timer.classList.add('running');

            gameState.timer_interval = setInterval(() => {
                remaining--;
                const minutes = Math.floor(remaining / 60);
                const seconds = remaining % 60;
                timer.innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                if (remaining <= 0) {
                    clearInterval(gameState.timer_interval);
                    gameState.timer_interval = null;
                    timer.classList.remove('running');
                }
            }, 1000);
        }

    
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🎮 EDGE Game loaded');
        });

        // Disable double-tap zoom on iOS
        document.addEventListener('dblclick', function(e) {
            e.preventDefault();
        }, { passive: false });

    </script>
